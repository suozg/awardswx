name: Build Windows Exe

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Перевіряємо, чи є зміни у коді або main.spec
    - name: Check if code changed
      id: codecheck
      run: |
        git fetch origin main
        CHANGED=$(git diff --name-only origin/main HEAD | grep -E '\.py$|\.spec$' || true)
        echo "changed=$CHANGED" >> $GITHUB_OUTPUT

    # Встановлюємо Python та залежності тільки якщо зміни є
    - uses: actions/setup-python@v5
      if: steps.codecheck.outputs.changed != ''
      with:
        python-version: "3.11"

    - name: Install dependencies
      if: steps.codecheck.outputs.changed != ''
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install wxPython Pillow bs4 openpyxl requests pyinstaller
        pip install sqlcipher3-wheels

    # Збірка з PyInstaller
    - name: Build with PyInstaller
      if: steps.codecheck.outputs.changed != ''
      run: pyinstaller --clean main.spec

    # Завантажуємо артефакт тільки після збірки
    - uses: actions/upload-artifact@v4
      if: steps.codecheck.outputs.changed != ''
      with:
        name: awardswx-windows-exe
        path: dist/
