name: Build Windows Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Як у вашому README

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install wxPython Pillow bs4 openpyxl requests pyinstaller
        pip install pysqlcipher3-binary --no-build-isolation

    - name: Build with PyInstaller
      run: |
        pyinstaller --clean main.spec

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: awardswx-windows-exe
        path: dist/
