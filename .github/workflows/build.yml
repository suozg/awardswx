name: Build Windows Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Дозволяє запускати збірку вручну

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Вкажіть версію, яку ви використовуєте

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install wxPython pysqlcipher3-binary Pillow bs4 openpyxl requests  

    - name: Build with PyInstaller
      run: |
        pyinstaller main.spec

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: awardswx-windows-exe
        path: dist/*.exe
