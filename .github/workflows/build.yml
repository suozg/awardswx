name: Build Windows + Debian 12

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  # ---------------- WINDOWS ----------------
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install wxPython Pillow bs4 openpyxl requests pandas pyinstaller
        pip install sqlcipher3-wheels

    - name: Build exe
      run: pyinstaller --clean main.spec

    - uses: actions/upload-artifact@v4
      with:
        name: awardswx-windows
        path: dist/

  # ---------------- DEBIAN 12 ----------------
  build-debian:
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        apt-get update
        apt-get install -y \
          python3 \
          python3-venv \
          python3-dev \
          build-essential \
          python3-wxgtk4.0 \
          libgtk-3-0 \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev

    - name: Setup venv + install deps
      run: |
        python3 -m venv venv --system-site-packages
        . venv/bin/activate

        pip install --upgrade pip
        pip install Pillow bs4 openpyxl requests pandas pyinstaller
        pip install sqlcipher3-wheels

    - name: Build binary
      run: |
        . venv/bin/activate
        pyinstaller --clean main.spec

    - uses: actions/upload-artifact@v4
      with:
        name: awardswx-debian12
        path: dist/

